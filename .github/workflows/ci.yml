# PyQuantLab CI 流水线（P11 规范落地）
# 阶段: lint → format → mypy(报告) → 单元测试 + 覆盖率门禁(≥80%)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (报告模式，不阻断)
        run: mypy .
        continue-on-error: true

  test:
    name: Unit Tests + Coverage ≥80%
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime deps (GUI 冒烟测试 offscreen 需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install torch (CPU, 官方源)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov pytest-qt

      - name: Run tests with coverage gate
        run: pytest tests/ --cov --cov-report=term-missing
        # 覆盖率门禁由 pyproject.toml [tool.coverage.report] fail_under=80 强制
